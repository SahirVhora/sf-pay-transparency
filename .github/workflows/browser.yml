name: Browser navigation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements.txt
      - name: Install browser test tools
        run: python -m pip install playwright==1.65.2
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Check demo pages, links, assets and browser errors
        env:
          BROWSER_START_COMMAND: python backend_server.py
          BROWSER_BASE_URL: http://127.0.0.1:8080/
        run: python .github/scripts/browser_navigation_check.py
